<title>Plan de Vida — Normas y Rosario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10182A;
    --panel:#1B2540;
    --panel-2:#212C4C;
    --ink:#EDE6D6;
    --ink-dim:#B9B2A0;
    --gold:#C9A44C;
    --gold-dim:rgba(201,164,76,0.28);
    --sage:#8A9B7B;
    --wine:#8A4A4A;
    --muted:#7A83A0;
    --line:rgba(237,230,214,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #182242 0%, #10182A 60%), var(--bg);
    color:var(--ink);
    font-family:'Crimson Pro', serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{width:100%;max-width:460px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    text-align:center;
    margin:0 0 2px;
    letter-spacing:0.01em;
  }
  .date-line{
    text-align:center;
    color:var(--ink-dim);
    font-size:15px;
    margin-bottom:22px;
    text-transform:capitalize;
  }

  /* Rosary ring */
  .ring-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:8px;}
  svg.ring{width:220px;height:250px;}
  .bead{cursor:pointer;transition:transform .15s ease;}
  .bead:hover{transform:scale(1.12);}
  .bead-circle{stroke:var(--gold-dim);stroke-width:1.5;fill:var(--panel-2);transition:fill .25s ease, stroke .25s ease;}
  .bead-circle.done{fill:var(--gold);stroke:var(--gold);}
  .ring-center-num{
    font-family:'JetBrains Mono', monospace;
    font-size:26px;
    fill:var(--ink);
  }
  .ring-center-label{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.12em;
    fill:var(--muted);
    text-transform:uppercase;
  }
  .cross-line{stroke:var(--gold-dim);stroke-width:2;}
  .cross-arm{stroke:var(--gold-dim);stroke-width:2;stroke-linecap:round;}

  .streak-row{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--sage);
    margin:6px 0 26px;
    letter-spacing:0.02em;
  }
  .streak-row b{color:var(--gold);font-weight:500;}

  .section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px 10px;
    margin-bottom:16px;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .section-title{
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
  }
  .section-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .edit-toggle{
    background:none;border:none;color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;cursor:pointer;padding:4px 2px;
    text-decoration:underline;text-underline-offset:3px;
  }
  .edit-toggle:hover{color:var(--gold);}

  .item-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .chk, .myst-box{
    width:20px;height:20px;flex:0 0 20px;
    border-radius:6px;
    border:1.5px solid var(--gold-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    background:var(--panel-2);
    transition:background .15s ease, border-color .15s ease;
  }
  .chk.done, .myst-box.done{background:var(--gold);border-color:var(--gold);}
  .chk.done::after, .myst-box.done::after{content:"✓";color:#10182A;font-size:13px;font-weight:700;}
  .item-label{flex:1;font-size:15.5px;line-height:1.3;}
  .item-label.done{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--gold-dim);}
  .item-remove{
    background:none;border:none;color:var(--wine);
    font-size:16px;cursor:pointer;padding:2px 6px;
    display:none;
  }
  .section.editing .item-remove{display:block;}

// Calcula la fecha del Domingo de Pascua para un año dado
// (algoritmo del cómputo gregoriano, "Anónimo" de Meeus/Jones/Butcher).
function getEasterDate(year){
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31); // 3 = marzo, 4 = abril
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}

// El tiempo de Pascua va del Domingo de Resurrección a Pentecostés
// (49 días después), inclusive. En ese periodo se reza el Regina Coeli
// en vez del Ángelus.
function isEastertide(d=new Date()){
  const easter = getEasterDate(d.getFullYear());
  const pentecost = new Date(easter);
  pentecost.setDate(pentecost.getDate() + 49);
  const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return today >= easter && today <= pentecost;
}

function pad(n){return n<10?'0'+n:''+n;}
function todayKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function monthKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function isoWeekKey(d=new Date()){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((dt-firstThursday)/86400000 - 3 + (firstThursday.getUTCDay()+6)%7)/7);
  return `${dt.getUTCFullYear()}-W${pad(week)}`;
}

// Dentro de Claude.ai existe window.storage (persistencia en la nube).
// Al abrir este archivo por tu cuenta (descargado, doble clic, etc.) esa
// función no existe, así que usamos localStorage del navegador como
// respaldo automático — así el check funciona en ambos casos.
const hasClaudeStorage = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';
const LOCAL_PREFIX = 'plan-de-vida:';

async function safeGet(key){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(LOCAL_PREFIX+key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function safeSet(key, val){
  if(hasClaudeStorage){
    try{
      await window.storage.set(key, JSON.stringify(val), false);
      storageOk = true;
    }catch(e){ storageOk = false; }
    return;
  }
  try{
    localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(val));
    storageOk = true;
  }catch(e){ storageOk = false; }
}
async function safeListKeys(){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.list('', false);
      return (r && r.keys) ? r.keys : [];
    }catch(e){ return []; }
  }
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(LOCAL_PREFIX)===0) keys.push(k.slice(LOCAL_PREFIX.length));
    }
    return keys;
  }catch(e){ return []; }
}
async function safeDelete(key){
  if(hasClaudeStorage){
    try{ await window.storage.delete(key, false); }catch(e){}
    return;
  }
  try{ localStorage.removeItem(LOCAL_PREFIX+key); }catch(e){}
}

async function computeStreak(){
  let streak = 0;
  let d = new Date();
  // if today isn't fully done yet, start counting from yesterday
  let key = todayKey(d);
  let entry = await getEntry('daily', key);
  const allDone = arr => config.daily.every(it => arr.includes(it.id));
  if(!allDone(entry)){
    d.setDate(d.getDate()-1);
  }
  for(let i=0;i<400;i++){
    key = todayKey(d);
    entry = await getEntry('daily', key);
    if(allDone(entry) && entry.length>0){
      streak++;
      d.setDate(d.getDate()-1);
    } else break;
  }
  return streak;
}

async function getHistory(days=28){
  const cells = [];
  const d = new Date();
  for(let i=days-1;i>=0;i--){
    const dd = new Date(d);
    dd.setDate(dd.getDate()-i);
    const key = todayKey(dd);
    const entry = await getEntry('daily', key);
    const pct = config.daily.length ? entry.length/config.daily.length : 0;
    cells.push({key, pct});
  }
  return cells;
}

function pickSpanishVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('es')) || voices[0] || null;
  }catch(e){ return null; }
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)){
      showToast('Tu navegador no admite lectura por voz.');
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'es-ES';
    utter.rate = 0.92;
    const voice = pickSpanishVoice();
    if(voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  }catch(e){
    showToast('No se pudo reproducir el audio.');
  }
}
function stopSpeaking(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}

// Igual que speak(), pero devuelve una promesa que se resuelve cuando
// termina de pronunciarse — permite encadenar oraciones en secuencia
// (modo manos libres) sin superponer audios.
function speakAsync(text){
  return new Promise((resolve)=>{
    try{
      if(!('speechSynthesis' in window)){ resolve(); return; }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-ES';
      utter.rate = 0.92;
      const voice = pickSpanishVoice();
      if(voice) utter.voice = voice;
      utter.onend = ()=>resolve();
      utter.onerror = ()=>resolve();
      window.speechSynthesis.speak(utter);
    }catch(e){ resolve(); }
  });
}
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

// Sonido de campana sintetizado (sin depender de ningún archivo de
// audio externo): varias ondas senoidales con una relación de
// frecuencias inarmónica típica de una campana, con caída exponencial.
let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
    return audioCtx;
  }catch(e){ return null; }
}
function playBellTone(volume=0.7){
  const ctx = getAudioCtx();
  if(!ctx || volume<=0) return;
  const now = ctx.currentTime;
  const partials = [1, 2.4, 3.5, 4.2];
  const fundamental = 440;
  partials.forEach((mult, idx)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = fundamental * mult;
    const peak = volume * (idx===0 ? 0.55 : 0.55/(idx+1));
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 2.3);
  });
}
async function playBellTolls(count=1, volume=0.7, gapMs=700){
  for(let i=0; i<count; i++){
    playBellTone(volume);
    if(i < count-1) await wait(gapMs);
  }
}

function beadPositions(n, cx, cy, r){
  const pts = [];
  for(let i=0;i<n;i++){
    const angle = (90 + i*(360/n)) * Math.PI/180; // start at bottom, clockwise
    pts.push({x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle)});
  }
  return pts;
}

function cellColor(pct){
  if(pct<=0) return 'var(--panel-2)';
  const alpha = 0.15 + pct*0.85;
  return `rgba(201,164,76,${alpha.toFixed(2)})`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachHandlers(){
  document.querySelectorAll('.chk, .bead').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      const target = e.currentTarget;
      const kind = target.dataset.kind;
      const id = target.dataset.id;
      let entryKey;
      if(kind==='daily') entryKey = todayKey();
      else if(kind==='weekly') entryKey = isoWeekKey();
      else entryKey = monthKey();
      await toggleEntry(kind, entryKey, id);
      await render();
    });
  });

  document.querySelectorAll('.edit-toggle').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const sec = e.currentTarget.dataset.sec;
      editing[sec] = !editing[sec];
      render();
    });
  });

  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const sec = e.currentTarget.dataset.add;
      const input = document.querySelector(`.add-row[data-sec="${sec}"] input`);
      const val = input.value.trim();
      if(!val) return;
      const id = sec[0]+Date.now();
      config[sec].push({id, label: val});
      await saveConfig();
      render();
    });
  });

  document.querySelectorAll('.item-remove').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const sec = e.currentTarget.dataset.sec;
      const id = e.currentTarget.dataset.id;
      if(!sec || !id) return;
      config[sec] = config[sec].filter(it=>it.id!==id);
      await saveConfig();
      render();
    });
  });

  document.querySelectorAll('.guide-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const kind = e.currentTarget.dataset.kind;
      const id = e.currentTarget.dataset.id;
      const item = config[kind].find(it=>it.id===id);
      if(!item) return;
      if(id === 'd11'){
        const info = getAngelusInfo();
        openGuide({label: info.label, guide: {text: info.guideText, url: ''}});
      } else {
        openGuide(item);
      }
    });
  });

  const openRosaryBtn = document.getElementById('open-rosary-btn');
  if(openRosaryBtn){
    openRosaryBtn.addEventListener('click', openRosary);
  }

  const ofrecimientoListenBtn = document.getElementById('ofrecimiento-listen-btn');
  if(ofrecimientoListenBtn){
    ofrecimientoListenBtn.addEventListener('click', ()=>{
      speak(PRAYERS.ofrecimiento);
    });
  }

  const angelusListenBtn = document.getElementById('angelus-listen-btn');
  if(angelusListenBtn){
    angelusListenBtn.addEventListener('click', ()=>{
      speak(getAngelusInfo().spokenText);
    });
  }

  const dismissBannerBtn = document.getElementById('dismiss-banner-btn');
  if(dismissBannerBtn){
    dismissBannerBtn.addEventListener('click', async ()=>{
      await safeSet(`banner-dismissed:${monthKey()}`, true);
      render();
    });
  }

  const openAnnualBtn = document.getElementById('open-annual-btn');
  if(openAnnualBtn){
    openAnnualBtn.addEventListener('click', openAnnualHistory);
  }

  const openJacBtn = document.getElementById('open-jac-btn');
  if(openJacBtn){
    openJacBtn.addEventListener('click', openJaculatorias);
  }

  const remEnabled = document.getElementById('rem-enabled');
  if(remEnabled){
    remEnabled.addEventListener('change', async (e)=>{
      config.reminders.enabled = e.target.checked;
      if(config.reminders.enabled && !config.reminders.permissionAsked){
        config.reminders.permissionAsked = true;
        try{
          if('Notification' in window && Notification.permission === 'default'){
            await Notification.requestPermission();
          }
        }catch(err){}
      }
      await saveConfig();
      render();
    });
  }

  document.querySelectorAll('.rem-time-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const idx = +e.target.dataset.idx;
      config.reminders.times[idx] = e.target.value;
      await saveConfig();
    });
  });

  const addTimeBtn = document.getElementById('rem-add-time');
  if(addTimeBtn){
    addTimeBtn.addEventListener('click', async ()=>{
      config.reminders.times.push('12:00');
      await saveConfig();
      render();
    });
  }

  document.querySelectorAll('.rem-time-remove').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const idx = +e.currentTarget.dataset.idx;
      config.reminders.times.splice(idx,1);
      await saveConfig();
      render();
    });
  });

  const remVolume = document.getElementById('rem-volume');
  const remVolumeLabel = document.getElementById('rem-volume-label');
  if(remVolume){
    remVolume.addEventListener('input', (e)=>{
      if(remVolumeLabel) remVolumeLabel.textContent = `${e.target.value}%`;
    });
    remVolume.addEventListener('change', async (e)=>{
      config.reminders.volume = +e.target.value;
      await saveConfig();
    });
  }

  const remTestSound = document.getElementById('rem-test-sound');
  if(remTestSound){
    remTestSound.addEventListener('click', ()=>{
      const vol = (remVolume ? +remVolume.value : config.reminders.volume) / 100;
      playBellTone(vol);
    });
  }

  const nextEx = document.getElementById('next-ex-input');
  if(nextEx){
    nextEx.addEventListener('change', async (e)=>{
      config.nextExercises = e.target.value;
      await saveConfig();
    });
  }

  const resetBtn = document.getElementById('reset-btn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(!confirm('Esto borrará tu configuración y tu historial guardados en este dispositivo. ¿Continuar?')) return;
      try{
        const keys = await safeListKeys();
        for(const k of keys) await safeDelete(k);
      }catch(e){}
      config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      await saveConfig();
      render();
    });
  }
}

function openGuide(item){
  const overlay = document.getElementById('modal-overlay');
  const title = document.getElementById('modal-title');
  const text = document.getElementById('modal-text');
  const actions = document.getElementById('modal-actions');
  const guide = item.guide || {};
  title.textContent = item.label;
  text.textContent = guide.text || 'Aún no hay una guía guardada para esta norma. Puedes pedir orientación a tu director espiritual, o buscar más información.';

  let links = guide.links;
  if(!links || !links.length){
    if(guide.url){
      links = [{label:'Leer más ↗', url:guide.url}];
    } else if(!guide.text){
      links = [{label:'Buscar ↗', url:`https://www.google.com/search?q=${encodeURIComponent(item.label)}`}];
    } else {
      links = [];
    }
  }

  actions.innerHTML = links.map(l=>
    `<a class="modal-link" href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.label)}</a>`
  ).join('') + `<button class="modal-close" id="modal-close-btn">cerrar</button>`;
  document.getElementById('modal-close-btn').addEventListener('click', closeGuide);

  overlay.classList.add('show');
}
function closeGuide(){
  document.getElementById('modal-overlay').classList.remove('show');
}

// Reza el Ave María 10 veces seguidas en voz alta, mostrando el conteo
// en el propio botón. Tocarlo de nuevo mientras suena lo detiene.
async function playHailMaryLoop(btn){
  if(hailMaryLoopActive){
    hailMaryLoopActive = false;
    stopSpeaking();
    btn.textContent = '🔊 Ave María';
    return;
  }
  autoRosaryActive = false; // no mezclar con el modo automático completo
  hailMaryLoopActive = true;
  for(let i=1; i<=10; i++){
    if(!hailMaryLoopActive) break;
    btn.textContent = `🔊 Ave María (${i}/10)`;
    await speakAsync(PRAYERS.avemaria);
    await wait(250);
  }
  hailMaryLoopActive = false;
  btn.textContent = '🔊 Ave María';
}

// Marca visualmente una tarjeta de misterio como rezada sin volver a
// renderizar todo el panel (para no cortar el modo automático).
function markMysteryDoneVisually(idx){
  const cards = document.querySelectorAll('#rosary-panel-content .mystery-card');
  const card = cards[idx];
  if(!card) return;
  card.classList.add('done');
  const box = card.querySelector('.myst-box');
  if(box) box.classList.add('done');
  const title = card.querySelector('.mystery-title');
  if(title) title.classList.add('done');
}

// Modo manos libres: recorre los 5 misterios de hoy reproduciendo en
// voz alta la meditación, el Padre Nuestro, las diez Ave Marías (con
// conteo en pantalla) y el Gloria de cada uno, en secuencia. Pensado
// para usarse en el carro o caminando, sin tocar el teléfono.
async function startAutoRosary(){
  const btn = document.getElementById('auto-rosary-btn');
  const statusEl = document.getElementById('auto-status');

  if(autoRosaryActive){
    autoRosaryActive = false;
    stopSpeaking();
    if(btn) btn.textContent = '🚗 Modo manos libres (rezar todo automáticamente)';
    if(statusEl) statusEl.textContent = 'Modo automático detenido.';
    return;
  }

  hailMaryLoopActive = false;
  autoRosaryActive = true;
  if(btn) btn.textContent = '⏹ Detener modo automático';
  const set = getTodayMysterySet();

  for(let i=0; i<set.list.length; i++){
    if(!autoRosaryActive) break;
    const m = set.list[i];

    if(statusEl) statusEl.textContent = `${i+1}º misterio: ${m.title} — meditación`;
    await speakAsync(`${m.title}. ${m.text}`);
    if(!autoRosaryActive) break;
    await wait(400);

    if(statusEl) statusEl.textContent = `${i+1}º misterio — Padre Nuestro`;
    await speakAsync(PRAYERS.padrenuestro);
    if(!autoRosaryActive) break;
    await wait(300);

    for(let h=1; h<=10; h++){
      if(!autoRosaryActive) break;
      if(statusEl) statusEl.textContent = `${i+1}º misterio — Ave María (${h}/10)`;
      await speakAsync(PRAYERS.avemaria);
      await wait(200);
    }
    if(!autoRosaryActive) break;

    if(statusEl) statusEl.textContent = `${i+1}º misterio — Gloria`;
    await speakAsync(PRAYERS.gloria);
    if(!autoRosaryActive) break;

    await markRosaryMysteryDone(i);
    markMysteryDoneVisually(i);
    const progressEl = document.querySelector('#rosary-panel-content .rosary-progress');
    if(progressEl){
      const prayedNow = await getRosaryEntry(todayKey());
      progressEl.textContent = `${prayedNow.length}/5 misterios rezados hoy`;
    }
    render();
    await wait(600);
  }

  const finished = autoRosaryActive;
  autoRosaryActive = false;
  if(btn) btn.textContent = '🚗 Modo manos libres (rezar todo automáticamente)';
  if(statusEl) statusEl.textContent = finished
    ? 'Rosario completo. Que Dios te bendiga. 🙏'
    : 'Modo automático detenido.';
}

// Panel de "Racha anual": recorre mes a mes desde el último 19 de
// marzo (fiesta de San José) hasta hoy, calculando el % de
// cumplimiento diario de cada mes y cuántos meses seguidos estuvieron
// completos al 100% cada día.
async function openAnnualHistory(){
  const overlay = document.getElementById('annual-overlay');
  const panel = document.getElementById('annual-panel-content');
  panel.innerHTML = `<div class="modal-title">Racha anual</div><div class="mystery-text">Calculando tu histórico…</div>`;
  overlay.classList.add('show');

  const now = new Date();
  let sjYear = now.getFullYear();
  const marchNineteen = new Date(sjYear, 2, 19);
  if(now < marchNineteen) sjYear -= 1;
  const startDate = new Date(sjYear, 2, 19);

  const months = [];
  let cursor = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
  const endCursor = new Date(now.getFullYear(), now.getMonth(), 1);
  while(cursor <= endCursor){
    months.push(new Date(cursor));
    cursor.setMonth(cursor.getMonth()+1);
  }

  const monthResults = [];
  for(const mDate of months){
    const year = mDate.getFullYear();
    const month = mDate.getMonth();
    const isStartMonth = (year===startDate.getFullYear() && month===startDate.getMonth());
    const isCurrentMonth = (year===now.getFullYear() && month===now.getMonth());
    const firstDay = isStartMonth ? startDate.getDate() : 1;
    const lastDay = isCurrentMonth ? now.getDate() : new Date(year, month+1, 0).getDate();

    let sum=0, count=0, fullDays=0;
    for(let day=firstDay; day<=lastDay; day++){
      const d = new Date(year, month, day);
      const entry = await getEntry('daily', todayKey(d));
      const pct = config.daily.length ? entry.length/config.daily.length : 0;
      sum += pct; count++;
      if(pct>=1) fullDays++;
    }
    monthResults.push({
      label: `${MONTH_NAMES[month]} ${year}`,
      avgPct: count ? sum/count : 0,
      fullDays, totalDays: count,
      kept: count>0 && fullDays===count
    });
  }

  let streak = 0;
  for(const m of monthResults){
    if(m.kept) streak++; else break;
  }

  panel.innerHTML = `
    <div class="modal-title">Racha anual</div>
    <div class="rosary-set-name">Desde el 19 de marzo de ${startDate.getFullYear()}</div>
    <div class="rosary-progress">${streak} ${streak===1?'mes completo':'meses completos'} seguidos</div>
    ${monthResults.slice().reverse().map(m=>`
      <div class="mystery-card ${m.kept?'done':''}">
        <div class="mystery-head">
          <div class="mystery-title ${m.kept?'done':''}" style="text-transform:capitalize;">${escapeHtml(m.label)}</div>
        </div>
        <div class="mystery-text">${Math.round(m.avgPct*100)}% de cumplimiento promedio · ${m.fullDays}/${m.totalDays} días al 100%</div>
      </div>
    `).join('')}
    <div class="modal-actions" style="margin-top:16px;">
      <button class="modal-close" id="annual-close-btn">cerrar</button>
    </div>
  `;
  document.getElementById('annual-close-btn').addEventListener('click', closeAnnualHistory);
}
function closeAnnualHistory(){
  document.getElementById('annual-overlay').classList.remove('show');
}

// Panel de jaculatorias: la comunión espiritual y las oraciones breves
// que rezaba san Josemaría, cada una con su propio botón de escuchar,
// para usarlas en cualquier momento del día. Las Preces se guardan
// como texto propio del usuario (ver nota de derechos de autor abajo).
async function openJaculatorias(){
  const overlay = document.getElementById('jac-overlay');
  const panel = document.getElementById('jac-panel-content');
  const savedPreces = (await safeGet('preces-text')) || '';

  panel.innerHTML = `
    <div class="modal-title">Jaculatorias</div>
    <div class="rem-note" style="margin-bottom:14px;">Oraciones breves para "lanzar" a Dios en cualquier momento del día — mientras trabajas, caminas o esperas. San Josemaría las tomaba de la Escritura y de la tradición cristiana.</div>

    <div class="mystery-card">
      <div class="mystery-head">
        <div class="mystery-title">Preces</div>
      </div>
      <div class="mystery-text" style="margin-bottom:8px;">Las Preces son un texto propio de la Prelatura (compuesto por san Josemaría), no de dominio público, así que esta app no lo trae incluido. Descárgalo gratis desde la página oficial y pégalo aquí una vez — quedará guardado solo en tu dispositivo, y el botón "Escuchar" leerá tu propio texto.</div>
      <a class="modal-link" href="https://opusdei.org/es/article/las-preces-del-opus-dei/" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;margin-bottom:10px;">Descargar las Preces ↗</a>
      <textarea id="preces-textarea" placeholder="Pega aquí el texto de las Preces (latín-castellano)…" style="width:100%;min-height:90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font-family:'Crimson Pro', serif;font-size:14px;resize:vertical;">${escapeHtml(savedPreces)}</textarea>
      <div class="mystery-actions" style="margin-top:10px;">
        <button class="edit-toggle" id="preces-save-btn">💾 Guardar</button>
        <button class="listen-btn" id="preces-speak-btn">🔊 Escuchar</button>
      </div>
    </div>

    <div class="mystery-card">
      <div class="mystery-head">
        <div class="mystery-title">Comunión espiritual</div>
      </div>
      <div class="mystery-text">${escapeHtml(PRAYERS.comunionespiritual)}</div>
      <div class="mystery-actions">
        <button class="listen-btn" data-jac-speak="comunion">🔊 Escuchar</button>
      </div>
    </div>

    ${JACULATORIAS.map((j,i)=>`
      <div class="mystery-card">
        <div class="mystery-text" style="margin-top:0;">${escapeHtml(j.text)}</div>
        ${j.by ? `<div class="section-sub" style="display:block;margin-bottom:8px;">— ${escapeHtml(j.by)}</div>` : ''}
        <div class="mystery-actions">
          <button class="listen-btn" data-jac-idx="${i}">🔊 Escuchar</button>
        </div>
      </div>
    `).join('')}

    <div class="modal-actions" style="margin-top:6px;">
      <button class="modal-close" id="jac-close-btn">cerrar</button>
    </div>
  `;

  const precesTextarea = document.getElementById('preces-textarea');
  document.getElementById('preces-save-btn').addEventListener('click', async ()=>{
    await safeSet('preces-text', precesTextarea.value);
    showToast('Preces guardadas en este dispositivo.');
  });
  document.getElementById('preces-speak-btn').addEventListener('click', ()=>{
    const text = precesTextarea.value.trim();
    if(!text){
      showToast('Pega primero el texto de las Preces para poder escucharlo.');
      return;
    }
    speak(text);
  });

  panel.querySelector('[data-jac-speak="comunion"]').addEventListener('click', ()=>{
    speak(PRAYERS.comunionespiritual);
  });
  panel.querySelectorAll('[data-jac-idx]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const idx = +e.currentTarget.dataset.jacIdx;
      speak(JACULATORIAS[idx].text);
    });
  });
  document.getElementById('jac-close-btn').addEventListener('click', closeJaculatorias);


  overlay.classList.add('show');
}
function closeJaculatorias(){
  stopSpeaking();
  document.getElementById('jac-overlay').classList.remove('show');
}

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 6000);
}

function fireReminder(label, customMsg){
  showToast(customMsg || `Recordatorio ${label} · un momento para tu plan de vida`);
  try{
    if('vibrate' in navigator) navigator.vibrate([60,40,60]);
  }catch(e){}
  try{
    const vol = config && config.reminders ? (config.reminders.volume||0)/100 : 0.7;
    playBellTone(vol);
  }catch(e){}
  try{
    if('Notification' in window && Notification.permission === 'granted' && document.hidden){
      new Notification('Plan de Vida', {
        body: customMsg || `Recordatorio de las ${label}: un momento para tu vida interior.`,
        silent:false
      });
    }
  }catch(e){}
}

async function checkReminders(){
  if(!config) return;
  const now = new Date();
  const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const dKey = todayKey(now);

  if(config.reminders && config.reminders.enabled && config.reminders.times.includes(hhmm)){
    const fired = (await safeGet(`reminders-fired:${dKey}`)) || [];
    if(!fired.includes(hhmm)){
      fired.push(hhmm);
      await safeSet(`reminders-fired:${dKey}`, fired);
      fireReminder(hhmm);
    }
  }

  if(config.rosary && config.rosary.mode==='spread' && config.rosary.remindersEnabled){
    const idx = config.rosary.times.indexOf(hhmm);
    if(idx>-1){
      const fired = (await safeGet(`rosary-fired:${dKey}`)) || [];
      if(!fired.includes(hhmm)){
        fired.push(hhmm);
        await safeSet(`rosary-fired:${dKey}`, fired);
        const set = getTodayMysterySet(now);
        const mystery = set.list[idx];
        if(mystery){
          fireReminder(hhmm, `Rosario · ${idx+1}º misterio: ${mystery.title}`);
        }
      }
    }
  }

  // 19 de marzo, fiesta de San José: se reinicia la racha anual,
  // con doce campanadas (una sola vez al año).
  if(now.getMonth()===2 && now.getDate()===19){
    const yr = now.getFullYear();
    const chimed = await safeGet(`sj-chime-fired:${yr}`);
    if(!chimed){
      await safeSet(`sj-chime-fired:${yr}`, true);
      showToast('🔔 19 de marzo, San José — comienza un nuevo año de tu racha');
      try{ if('vibrate' in navigator) navigator.vibrate([80,60,80,60,80,60,80]); }catch(e){}
      const vol = (config.reminders.volume||70)/100;
      playBellTolls(12, vol, 550);
    }
  }
}

(async function init(){
  await loadConfig();
  await render();
  setInterval(checkReminders, 20000);

  const overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('click', (e)=>{
    if(e.target === overlay) closeGuide();
  });

  const rosaryOverlay = document.getElementById('rosary-overlay');
  rosaryOverlay.addEventListener('click', (e)=>{
    if(e.target === rosaryOverlay) closeRosary();
  });

  const annualOverlay = document.getElementById('annual-overlay');
  annualOverlay.addEventListener('click', (e)=>{
    if(e.target === annualOverlay) closeAnnualHistory();
  });

  const jacOverlay = document.getElementById('jac-overlay');
  jacOverlay.addEventListener('click', (e)=>{
    if(e.target === jacOverlay) closeJaculatorias();
  });
})();
</script>
