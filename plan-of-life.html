<title>Plan of Life — Norms and Rosary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10182A;
    --panel:#1B2540;
    --panel-2:#212C4C;
    --ink:#EDE6D6;
    --ink-dim:#B9B2A0;
    --gold:#C9A44C;
    --gold-dim:rgba(201,164,76,0.28);
    --sage:#8A9B7B;
    --wine:#8A4A4A;
    --muted:#7A83A0;
    --line:rgba(237,230,214,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #182242 0%, #10182A 60%), var(--bg);
    color:var(--ink);
    font-family:'Crimson Pro', serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{width:100%;max-width:460px;}
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    text-align:center;
    margin:0 0 2px;
    letter-spacing:0.01em;
  }
  .date-line{
    text-align:center;
    color:var(--ink-dim);
    font-size:15px;
    margin-bottom:22px;
  }

  /* Rosary ring */
  .ring-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:8px;}
  svg.ring{width:220px;height:250px;}
  .bead{cursor:pointer;transition:transform .15s ease;}
  .bead:hover{transform:scale(1.12);}
  .bead-circle{stroke:var(--gold-dim);stroke-width:1.5;fill:var(--panel-2);transition:fill .25s ease, stroke .25s ease;}
  .bead-circle.done{fill:var(--gold);stroke:var(--gold);}
  .ring-center-num{
    font-family:'JetBrains Mono', monospace;
    font-size:26px;
    fill:var(--ink);
  }
  .ring-center-label{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.12em;
    fill:var(--muted);
    text-transform:uppercase;
  }
  .cross-line{stroke:var(--gold-dim);stroke-width:2;}
  .cross-arm{stroke:var(--gold-dim);stroke-width:2;stroke-linecap:round;}

  .streak-row{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--sage);
    margin:6px 0 26px;
    letter-spacing:0.02em;
  }
  .streak-row b{color:var(--gold);font-weight:500;}

  .section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px 10px;
    margin-bottom:16px;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .section-title{
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
  }
  .section-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .edit-toggle{
    background:none;border:none;color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;cursor:pointer;padding:4px 2px;
    text-decoration:underline;text-underline-offset:3px;
  }
  .edit-toggle:hover{color:var(--gold);}

  .item-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .chk, .myst-box{
    width:20px;height:20px;flex:0 0 20px;
    border-radius:6px;
    border:1.5px solid var(--gold-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    background:var(--panel-2);
    transition:background .15s ease, border-color .15s ease;
  }
  .chk.done, .myst-box.done{background:var(--gold);border-color:var(--gold);}
  .chk.done::after, .myst-box.done::after{content:"✓";color:#10182A;font-size:13px;font-weight:700;}
  .item-label{flex:1;font-size:15.5px;line-height:1.3;}
  .item-label.done{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--gold-dim);}
  .item-remove{
    background:none;border:none;color:var(--wine);
    font-size:16px;cursor:pointer;padding:2px 6px;
    display:none;
  }
  .section.editing .item-remove{display:block;}

  .add-row{display:flex;gap:8px;margin:10px 0 6px;display:none;}
  .section.editing .add-row{display:flex;}
  .add-row input{

// Calculates Easter Sunday for a given year (the "Anonymous" Gregorian
// computus algorithm by Meeus/Jones/Butcher).
function getEasterDate(year){
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31); // 3 = March, 4 = April
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}

// Eastertide runs from Easter Sunday through Pentecost Sunday (49 days
// later), inclusive. During this period, the Regina Caeli is prayed
// instead of the Angelus.
function isEastertide(d=new Date()){
  const easter = getEasterDate(d.getFullYear());
  const pentecost = new Date(easter);
  pentecost.setDate(pentecost.getDate() + 49);
  const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return today >= easter && today <= pentecost;
}

function pad(n){return n<10?'0'+n:''+n;}
function todayKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function monthKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function isoWeekKey(d=new Date()){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((dt-firstThursday)/86400000 - 3 + (firstThursday.getUTCDay()+6)%7)/7);
  return `${dt.getUTCFullYear()}-W${pad(week)}`;
}

// localStorage — this way checking items off works in both cases.
const hasClaudeStorage = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';
const LOCAL_PREFIX = 'plan-of-life:';

async function safeGet(key){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(LOCAL_PREFIX+key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function safeSet(key, val){
  if(hasClaudeStorage){
    try{
      await window.storage.set(key, JSON.stringify(val), false);
      storageOk = true;
    }catch(e){ storageOk = false; }
    return;
  }
  try{
    localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(val));
    storageOk = true;
  }catch(e){ storageOk = false; }
}
async function safeListKeys(){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.list('', false);
      return (r && r.keys) ? r.keys : [];
    }catch(e){ return []; }
  }
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(LOCAL_PREFIX)===0) keys.push(k.slice(LOCAL_PREFIX.length));
    }
    return keys;
  }catch(e){ return []; }
}
async function safeDelete(key){
  if(hasClaudeStorage){
    try{ await window.storage.delete(key, false); }catch(e){}
    return;
  }
  try{ localStorage.removeItem(LOCAL_PREFIX+key); }catch(e){}
}

async function loadConfig(){
  const c = await safeGet('items-config');
  const fresh = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  if(!c){
    config = fresh;
    await safeSet('items-config', config);
  } else {
    config = Object.assign({}, fresh, c);
    if(!config.reminders) config.reminders = fresh.reminders;
    if(!config.rosary) config.rosary = fresh.rosary;
    await safeSet('items-config', config);
  }
}
async function saveConfig(){ await safeSet('items-config', config); }

async function getEntry(kind, key){
  const e = await safeGet(`entry:${kind}:${key}`);
  return e || [];
}
async function toggleEntry(kind, entryKey, itemId){
  const list = await getEntry(kind, entryKey);
  const idx = list.indexOf(itemId);
  if(idx>-1) list.splice(idx,1); else list.push(itemId);
  await safeSet(`entry:${kind}:${entryKey}`, list);
  return list;
}

async function computeStreak(){
  let streak = 0;
  let d = new Date();
  let key = todayKey(d);
  let entry = await getEntry('daily', key);
  const allDone = arr => config.daily.every(it => arr.includes(it.id));
  if(!allDone(entry)){
    d.setDate(d.getDate()-1);
  }
  for(let i=0;i<400;i++){
    key = todayKey(d);
    entry = await getEntry('daily', key);
    if(allDone(entry) && entry.length>0){
      streak++;
      d.setDate(d.getDate()-1);
    } else break;
  }
  return streak;
}

async function getHistory(days=28){
  const cells = [];
  const d = new Date();
  for(let i=days-1;i>=0;i--){
    const dd = new Date(d);
    dd.setDate(dd.getDate()-i);
    const key = todayKey(dd);
    const entry = await getEntry('daily', key);
    const pct = config.daily.length ? entry.length/config.daily.length : 0;
    cells.push({key, pct});
  }
  return cells;
}

function pickEnglishVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0] || null;
  }catch(e){ return null; }
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)){
      showToast('Your browser does not support voice playback.');
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.92;
    const voice = pickEnglishVoice();
    if(voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  }catch(e){
    showToast('Could not play audio.');
  }
}
function stopSpeaking(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}

// Same as speak(), but returns a promise that resolves when the speech
// finishes — lets us chain prayers in sequence (hands-free mode)
// without overlapping audio.
function speakAsync(text){
  return new Promise((resolve)=>{
    try{
      if(!('speechSynthesis' in window)){ resolve(); return; }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.92;
      const voice = pickEnglishVoice();
      if(voice) utter.voice = voice;
      utter.onend = ()=>resolve();
      utter.onerror = ()=>resolve();
      window.speechSynthesis.speak(utter);
    }catch(e){ resolve(); }
  });
}
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function getRosaryEntry(dateKey){
  const e = await safeGet(`entry:rosarymyst:${dateKey}`);
  return e || [];
}
async function toggleRosaryMystery(idx){
  const dKey = todayKey();
  const list = await getRosaryEntry(dKey);
  const i = list.indexOf(idx);
  if(i>-1) list.splice(i,1); else list.push(idx);
  await safeSet(`entry:rosarymyst:${dKey}`, list);
  if(list.length>=5){
    const dailyEntry = await getEntry('daily', dKey);
    if(!dailyEntry.includes('d7')){
      dailyEntry.push('d7');
      await safeSet(`entry:daily:${dKey}`, dailyEntry);
    }
  }
  return list;
}

// Marks a mystery as prayed without toggling it off (for hands-free
// mode: if it's already marked, it stays marked).
async function markRosaryMysteryDone(idx){
  const dKey = todayKey();
  const list = await getRosaryEntry(dKey);
  if(!list.includes(idx)){
    list.push(idx);
    await safeSet(`entry:rosarymyst:${dKey}`, list);
  }
  if(list.length>=5){
    const dailyEntry = await getEntry('daily', dKey);
    if(!dailyEntry.includes('d7')){
      dailyEntry.push('d7');
      await safeSet(`entry:daily:${dKey}`, dailyEntry);
    }
  }
  return list;
}

function beadPositions(n, cx, cy, r){
  const pts = [];
  for(let i=0;i<n;i++){
    const angle = (90 + i*(360/n)) * Math.PI/180;
    pts.push({x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle)});
  }
  return pts;
}

function cellColor(pct){
  if(pct<=0) return 'var(--panel-2)';
  const alpha = 0.15 + pct*0.85;
  return `rgba(201,164,76,${alpha.toFixed(2)})`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachHandlers(){
  document.querySelectorAll('.chk, .bead').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      const target = e.currentTarget;
      const kind = target.dataset.kind;
      const id = target.dataset.id;
      let entryKey;
      if(kind==='daily') entryKey = todayKey();
      else if(kind==='weekly') entryKey = isoWeekKey();
      else entryKey = monthKey();
      await toggleEntry(kind, entryKey, id);
      await render();
    });
  });

  document.querySelectorAll('.edit-toggle').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const sec = e.currentTarget.dataset.sec;
      editing[sec] = !editing[sec];
      render();
    });
  });

  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const sec = e.currentTarget.dataset.add;
      const input = document.querySelector(`.add-row[data-sec="${sec}"] input`);
      const val = input.value.trim();
      if(!val) return;
      const id = sec[0]+Date.now();
      config[sec].push({id, label: val});
      await saveConfig();
      render();
    });
  });

  document.querySelectorAll('.item-remove').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const sec = e.currentTarget.dataset.sec;
      const id = e.currentTarget.dataset.id;
      if(!sec || !id) return;
      config[sec] = config[sec].filter(it=>it.id!==id);
      await saveConfig();
      render();
    });
  });

  document.querySelectorAll('.guide-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const kind = e.currentTarget.dataset.kind;
      const id = e.currentTarget.dataset.id;
      const item = config[kind].find(it=>it.id===id);
      if(!item) return;
      if(id === 'd11'){
        const info = getAngelusInfo();
        openGuide({label: info.label, guide: {text: info.guideText, url: ''}});
      } else {
        openGuide(item);
      }
    });
  });

  const openRosaryBtn = document.getElementById('open-rosary-btn');
  if(openRosaryBtn){
    openRosaryBtn.addEventListener('click', openRosary);
  }

  const angelusListenBtn = document.getElementById('angelus-listen-btn');
  if(angelusListenBtn){
    angelusListenBtn.addEventListener('click', ()=>{
      speak(getAngelusInfo().spokenText);
    });
  }

  const remEnabled = document.getElementById('rem-enabled');
  if(remEnabled){
    remEnabled.addEventListener('change', async (e)=>{
      config.reminders.enabled = e.target.checked;
      if(config.reminders.enabled && !config.reminders.permissionAsked){
        config.reminders.permissionAsked = true;
        try{
          if('Notification' in window && Notification.permission === 'default'){
            await Notification.requestPermission();
          }
        }catch(err){}
      }
      await saveConfig();
      render();
    });
  }

  document.querySelectorAll('.rem-time-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const idx = +e.target.dataset.idx;
      config.reminders.times[idx] = e.target.value;
      await saveConfig();
    });
  });

  const addTimeBtn = document.getElementById('rem-add-time');
  if(addTimeBtn){
    addTimeBtn.addEventListener('click', async ()=>{
      config.reminders.times.push('12:00');
      await saveConfig();
      render();
    });
  }

  document.querySelectorAll('.rem-time-remove').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const idx = +e.currentTarget.dataset.idx;
      config.reminders.times.splice(idx,1);
      await saveConfig();
      render();
    });
  });

  const nextEx = document.getElementById('next-ex-input');
  if(nextEx){
    nextEx.addEventListener('change', async (e)=>{
      config.nextExercises = e.target.value;
      await saveConfig();
    });
  }

  const resetBtn = document.getElementById('reset-btn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(!confirm('This will erase your configuration and history saved on this device. Continue?')) return;
      try{
        const keys = await safeListKeys();
        for(const k of keys) await safeDelete(k);
      }catch(e){}
      config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      await saveConfig();
      render();
    });
  }
}

function openGuide(item){
  const overlay = document.getElementById('modal-overlay');
  const title = document.getElementById('modal-title');
  const text = document.getElementById('modal-text');
  const actions = document.getElementById('modal-actions');
  const guide = item.guide || {};
  title.textContent = item.label;
  text.textContent = guide.text || 'There isn\'t a saved guide for this norm yet. You can ask your spiritual director, or look up more information.';

  let links = guide.links;
  if(!links || !links.length){
    if(guide.url){
      links = [{label:'Read more ↗', url:guide.url}];
    } else if(!guide.text){
      links = [{label:'Search ↗', url:`https://www.google.com/search?q=${encodeURIComponent(item.label)}`}];
    } else {
      links = [];
    }
  }

  actions.innerHTML = links.map(l=>
    `<a class="modal-link" href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.label)}</a>`
  ).join('') + `<button class="modal-close" id="modal-close-btn">close</button>`;
  document.getElementById('modal-close-btn').addEventListener('click', closeGuide);

  overlay.classList.add('show');
}
function closeGuide(){
  document.getElementById('modal-overlay').classList.remove('show');
}

async function openRosary(){
  await renderRosaryPanel();
  document.getElementById('rosary-overlay').classList.add('show');
}
function closeRosary(){
  autoRosaryActive = false;
  hailMaryLoopActive = false;
  stopSpeaking();
  document.getElementById('rosary-overlay').classList.remove('show');
}

async function renderRosaryPanel(){
  const panel = document.getElementById('rosary-panel-content');
  const set = getTodayMysterySet();
  const dKey = todayKey();
  const prayed = await getRosaryEntry(dKey);
  const mode = config.rosary.mode;

  panel.innerHTML = `
    <div class="modal-title">Holy Rosary</div>
    <div class="rosary-set-name">Today: ${set.name}</div>
    <div class="rem-note" style="margin-bottom:14px;">The meditations below are a brief summary, original to this app. For St. Josemaría's complete meditations on each mystery, as published on the official Opus Dei site: <a href="https://opusdei.org/en-us/article/how-to-pray-the-rosary/" target="_blank" rel="noopener" style="color:var(--gold);">read here ↗</a></div>

    <div class="prayer-row">
      <button class="prayer-btn" data-prayer="ourfather">🔊 Our Father</button>
      <button class="prayer-btn" id="avemaria-btn" data-prayer="hailmary">🔊 Hail Mary</button>
      <button class="prayer-btn" data-prayer="glorybe">🔊 Glory Be</button>
    </div>

    <button class="listen-btn" id="auto-rosary-btn" style="width:100%;margin-bottom:6px;padding:11px;font-size:12.5px;">🚗 Hands-free mode (pray it all automatically)</button>
    <div class="rem-note" id="auto-status" style="text-align:center;min-height:14px;margin-bottom:14px;">Great for the car or while walking: plays each mystery's meditation, the Our Father, ten Hail Marys, and the Glory Be out loud, one after another.</div>

    <div class="mode-toggle">
      <button class="mode-btn ${mode==='session'?'active':''}" data-mode="session">Single session</button>
      <button class="mode-btn ${mode==='spread'?'active':''}" data-mode="spread">Spread through the day</button>
    </div>

    <div class="rosary-progress">${prayed.length}/5 mysteries prayed today</div>

    ${set.list.map((m,i)=>{
      const done = prayed.includes(i);
      return `<div class="mystery-card ${done?'done':''}">
        <div class="mystery-head">
          <div class="mystery-num">${i+1}${['st','nd','rd'][i] && i<3 ? ['st','nd','rd'][i] : 'th'}</div>
          <div class="mystery-title ${done?'done':''}">${escapeHtml(m.title)}</div>
          <div class="myst-box ${done?'done':''}" data-mystery-idx="${i}" title="Mark as prayed"></div>
        </div>
        <div class="mystery-text">${escapeHtml(m.text)}</div>
        <div class="mystery-actions">
          ${mode==='spread' ? `<input type="time" class="mystery-time" data-time-idx="${i}" value="${config.rosary.times[i]||''}" />` : ''}
          <button class="listen-btn" data-speak="${i}">🔊 Listen to meditation</button>
        </div>
      </div>`;
    }).join('')}

    ${mode==='spread' ? `
      <div class="rem-toggle-row">
        <div>
          <div class="section-title" style="font-size:15px;">Rosary Reminders</div>
          <div class="section-sub">alerts at each scheduled time</div>
        </div>
        <label class="rem-switch">
          <input type="checkbox" id="rosary-rem-enabled" ${config.rosary.remindersEnabled?'checked':''} />
          <span></span>
        </label>
      </div>
      <div class="rem-note">When each scheduled time arrives, you'll get an alert (vibration/notice) to pray that mystery. Works while this tab stays open.</div>
    ` : ''}

    <div class="modal-actions" style="margin-top:16px;">
      <button class="modal-close" id="rosary-close-btn">close</button>
    </div>
  `;

  document.getElementById('rosary-close-btn').addEventListener('click', closeRosary);

  panel.querySelectorAll('.prayer-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const prayerKey = e.currentTarget.dataset.prayer;
      if(prayerKey === 'hailmary'){
        playHailMaryLoop(e.currentTarget);
      } else {
        hailMaryLoopActive = false;
        speak(PRAYERS[prayerKey]);
      }
    });
  });

  const autoBtn = document.getElementById('auto-rosary-btn');
  if(autoBtn){
    autoBtn.addEventListener('click', startAutoRosary);
  }

  panel.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      config.rosary.mode = e.currentTarget.dataset.mode;
      await saveConfig();
      renderRosaryPanel();
    });
  });

  panel.querySelectorAll('[data-mystery-idx]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      autoRosaryActive = false;
      hailMaryLoopActive = false;
      stopSpeaking();
      await toggleRosaryMystery(+e.currentTarget.dataset.mysteryIdx);
      renderRosaryPanel();
      render();
    });
  });

  panel.querySelectorAll('[data-speak]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      autoRosaryActive = false;
      hailMaryLoopActive = false;
      const idx = +e.currentTarget.dataset.speak;
      const m = set.list[idx];
      speak(`${m.title}. ${m.text}`);
    });
  });

  panel.querySelectorAll('[data-time-idx]').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      config.rosary.times[+e.target.dataset.timeIdx] = e.target.value;
      await saveConfig();
    });
  });

  const rosaryRem = document.getElementById('rosary-rem-enabled');
  if(rosaryRem){
    rosaryRem.addEventListener('change', async (e)=>{
      config.rosary.remindersEnabled = e.target.checked;
      if(config.rosary.remindersEnabled && !config.rosary.permissionAsked){
        config.rosary.permissionAsked = true;
        try{
          if('Notification' in window && Notification.permission === 'default'){
            await Notification.requestPermission();
          }
        }catch(err){}
      }
      await saveConfig();
    });
  }
}

// Prays the Hail Mary 10 times in a row out loud, showing the count on
// the button itself. Tapping it again while it's playing stops it.
async function playHailMaryLoop(btn){
  if(hailMaryLoopActive){
    hailMaryLoopActive = false;
    stopSpeaking();
    btn.textContent = '🔊 Hail Mary';
    return;
  }
  autoRosaryActive = false; // don't mix with the full hands-free mode
  hailMaryLoopActive = true;
  for(let i=1; i<=10; i++){
    if(!hailMaryLoopActive) break;
    btn.textContent = `🔊 Hail Mary (${i}/10)`;
    await speakAsync(PRAYERS.hailmary);
    await wait(250);
  }
  hailMaryLoopActive = false;
  btn.textContent = '🔊 Hail Mary';
}

// Visually marks a mystery card as prayed without re-rendering the
// whole panel (so it doesn't interrupt hands-free mode).
function markMysteryDoneVisually(idx){
  const cards = document.querySelectorAll('#rosary-panel-content .mystery-card');
  const card = cards[idx];
  if(!card) return;
  card.classList.add('done');
  const box = card.querySelector('.myst-box');
  if(box) box.classList.add('done');
  const title = card.querySelector('.mystery-title');
  if(title) title.classList.add('done');
}

// Hands-free mode: goes through today's 5 mysteries, speaking the
// meditation, the Our Father, the ten Hail Marys (with an on-screen
// count), and the Glory Be for each one, in sequence. Meant for the
// car or while walking, without touching the phone.
async function startAutoRosary(){
  const btn = document.getElementById('auto-rosary-btn');
  const statusEl = document.getElementById('auto-status');

  if(autoRosaryActive){
    autoRosaryActive = false;
    stopSpeaking();
    if(btn) btn.textContent = '🚗 Hands-free mode (pray it all automatically)';
    if(statusEl) statusEl.textContent = 'Hands-free mode stopped.';
    return;
  }

  hailMaryLoopActive = false;
  autoRosaryActive = true;
  if(btn) btn.textContent = '⏹ Stop hands-free mode';
  const set = getTodayMysterySet();

  for(let i=0; i<set.list.length; i++){
    if(!autoRosaryActive) break;
    const m = set.list[i];

    if(statusEl) statusEl.textContent = `Mystery ${i+1}: ${m.title} — meditation`;
    await speakAsync(`${m.title}. ${m.text}`);
    if(!autoRosaryActive) break;
    await wait(400);

    if(statusEl) statusEl.textContent = `Mystery ${i+1} — Our Father`;
    await speakAsync(PRAYERS.ourfather);
    if(!autoRosaryActive) break;
    await wait(300);

    for(let h=1; h<=10; h++){
      if(!autoRosaryActive) break;
      if(statusEl) statusEl.textContent = `Mystery ${i+1} — Hail Mary (${h}/10)`;
      await speakAsync(PRAYERS.hailmary);
      await wait(200);
    }
    if(!autoRosaryActive) break;

    if(statusEl) statusEl.textContent = `Mystery ${i+1} — Glory Be`;
    await speakAsync(PRAYERS.glorybe);
    if(!autoRosaryActive) break;

    await markRosaryMysteryDone(i);
    markMysteryDoneVisually(i);
    const progressEl = document.querySelector('#rosary-panel-content .rosary-progress');
    if(progressEl){
      const prayedNow = await getRosaryEntry(todayKey());
      progressEl.textContent = `${prayedNow.length}/5 mysteries prayed today`;
    }
    render();
    await wait(600);
  }

  const finished = autoRosaryActive;
  autoRosaryActive = false;
  if(btn) btn.textContent = '🚗 Hands-free mode (pray it all automatically)';
  if(statusEl) statusEl.textContent = finished
    ? 'Rosary complete. God bless you. 🙏'
    : 'Hands-free mode stopped.';
}

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 6000);
}

function fireReminder(label, customMsg){
  showToast(customMsg || `Reminder ${label} · a moment for your plan of life`);
  try{
    if('vibrate' in navigator) navigator.vibrate([60,40,60]);
  }catch(e){}
  try{
    if('Notification' in window && Notification.permission === 'granted' && document.hidden){
      new Notification('Plan of Life', {
        body: customMsg || `Reminder at ${label}: a moment for your interior life.`,
        silent:false
      });
    }
  }catch(e){}
}

async function checkReminders(){
  if(!config) return;
  const now = new Date();
  const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const dKey = todayKey(now);

  if(config.reminders && config.reminders.enabled && config.reminders.times.includes(hhmm)){
    const fired = (await safeGet(`reminders-fired:${dKey}`)) || [];
    if(!fired.includes(hhmm)){
      fired.push(hhmm);
      await safeSet(`reminders-fired:${dKey}`, fired);
      fireReminder(hhmm);
    }
  }

  if(config.rosary && config.rosary.mode==='spread' && config.rosary.remindersEnabled){
    const idx = config.rosary.times.indexOf(hhmm);
    if(idx>-1){
      const fired = (await safeGet(`rosary-fired:${dKey}`)) || [];
      if(!fired.includes(hhmm)){
        fired.push(hhmm);
        await safeSet(`rosary-fired:${dKey}`, fired);
        const set = getTodayMysterySet(now);
        const mystery = set.list[idx];
        if(mystery){
          fireReminder(hhmm, `Rosary · mystery ${idx+1}: ${mystery.title}`);
        }
      }
    }
  }
}

(async function init(){
  await loadConfig();
  await render();
  setInterval(checkReminders, 20000);

  const overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('click', (e)=>{
    if(e.target === overlay) closeGuide();
  });

  const rosaryOverlay = document.getElementById('rosary-overlay');
  rosaryOverlay.addEventListener('click', (e)=>{
    if(e.target === rosaryOverlay) closeRosary();
  });
})();
</script>
