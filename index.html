function dec(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);return new TextDecoder('utf-8').decode(u);}
function pick(){
  var v=null;
  try{ var q=new URLSearchParams(location.search).get('lang'); if(APPS[q]) return q; }catch(e){}
  try{ var wn=(window.name||''); if(wn.indexOf('plan-lang:')===0 && APPS[wn.slice(10)]) return wn.slice(10); }catch(e){}
  try{ var st=localStorage.getItem('plan-lang'); if(APPS[st]) return st; }catch(e){}
  var n=((navigator.language||'es')+'').slice(0,2).toLowerCase();
  return APPS[n]?n:'en';
}
function remember(l){
  try{ window.name='plan-lang:'+l; }catch(e){}
  try{ localStorage.setItem('plan-lang',l); }catch(e){}
  try{ var u=new URL(location.href); if(u.searchParams.has('lang')){ u.searchParams.set('lang',l); history.replaceState(null,'',u.toString()); } }catch(e){}
}
// migración única: datos de la versión inglesa antigua (prefijo plan-of-life:)
try{
  if(!localStorage.getItem('plan-migrated-en')){
    var keys=[]; for(var i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
    keys.forEach(function(k){
      if(k.indexOf('plan-of-life:')===0){
        var suf=k.slice(13), nk='plan-de-vida:'+(suf==='items-config'?'items-config:en':suf);
        if(localStorage.getItem(nk)===null) localStorage.setItem(nk,localStorage.getItem(k));
      }
    });
    localStorage.setItem('plan-migrated-en','1');
  }
}catch(e){}
var f=document.getElementById('f');
function show(l){ remember(l); document.documentElement.lang=l; f.srcdoc=dec(APPS[l]); }
window.addEventListener('message',function(e){
  if(e.source===f.contentWindow && e.data && APPS[e.data.planLang]) show(e.data.planLang);
});
show(pick());
})();
